name: Ryt Node 24 Build

# Proof build: Flowise 3.1.4 from the release tag, built with the root Dockerfile
# (pnpm + lockfile) on node:24-alpine, then smoke-tested on amd64. Nothing is pushed.

on:
    push:
        branches:
            - ryt/node24-build-3.1.4
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Free disk space
              run: |
                  sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
                  df -h /
            - uses: actions/checkout@v6
            - name: Build
              run: docker build --no-cache -t flowise-node24 .
            - name: Runtime versions
              run: |
                  docker run --rm --entrypoint node flowise-node24 -e '
                      const v = process.versions
                      console.log("node", v.node, "brotli", v.brotli)
                      const [maj, min, pat] = v.node.split(".").map(Number)
                      // CVE-2026-111497 is fixed in Node 24.22.1
                      if (maj !== 24 || min < 22 || (min === 22 && pat < 1)) {
                          console.error("Node", v.node, "is older than the fixed 24.22.1")
                          process.exit(1)
                      }'
            - name: Smoke test
              run: |
                  docker run -d --name flowise -p 3000:3000 flowise-node24
                  for i in $(seq 1 60); do
                      curl -fsS http://localhost:3000/api/v1/ping && break
                      sleep 5
                  done
                  curl -fsS http://localhost:3000/api/v1/ping
                  sleep 10
                  if docker logs flowise 2>&1 | grep -F '[ERROR]'; then
                      echo "Startup logged errors"
                      exit 1
                  fi
            - name: Container logs
              if: always()
              run: docker logs flowise || true
